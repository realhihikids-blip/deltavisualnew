name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
          build-root-directory: "DELTA-VISUALS-full (5)"

      - name: Build
        working-directory: "DELTA-VISUALS-full (5)"
        run: gradle build --stacktrace

      - name: Show result
        working-directory: "DELTA-VISUALS-full (5)"
        run: ls -la build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: delta-visuals
          path: |
            DELTA-VISUALS-full (5)/build/libs/*.jar
            !DELTA-VISUALS-full (5)/build/libs/*-sources.jar
          if-no-files-found: error
